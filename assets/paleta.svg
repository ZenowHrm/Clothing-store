<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
    <!-- Grupo principal con los estilos del diseño: trazo grueso y bordes redondeados, relleno blanco -->
    <g fill="#ffffff" stroke="#000000" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
        
        <!-- Base de la Paleta (Preservada fielmente) -->
        <path d="M 430,240
                 A 190,190 0 1,0 240,430
                 C 320,430 330,390 330,340
                 C 330,290 390,260 430,240 Z" />

        <!-- Tres orificios de pintura (Preservados en sus posiciones originales) -->
        <circle cx="130" cy="170" r="24" />
        <circle cx="96" cy="260" r="24" />
        <circle cx="160" cy="350" r="24" />

        <!-- Pincel (Rediseñado, reposicionado y escalado) -->
        <!-- Se ha ajustado la coordenada Y de translate(400, 375) para subirlo un poco más -->
        <g transform="translate(300, 275) scale(0.8) rotate(-30)">
            
            <!-- Mango del pincel con base redondeada -->
            <path d="M -26,20 
                     L 26,20
                     L 26,166
                     A 26,26 0 0 1 -26,166 Z" />
                     
            <!-- Virola (la pieza metálica, centrada en (0,0)) -->
            <rect x="-36" y="-20" width="72" height="40" />
            
            <!-- Punta del pincel (forma de gota, rediseñada alrededor de (0,0)) -->
            <path d="M -36,-20 
                     C -96,-64 -66,-184 0,-224 
                     C 66,-184 96,-64 36,-20 Z" />
        </g>
    </g>
</svg>
